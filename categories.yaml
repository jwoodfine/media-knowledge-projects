# Canonical category taxonomy for the projects wiki. Single source of truth. Consumed by the wiki engine for the category nav; see .agent/audit/2026-07-02-category-redesign/proposal-projects.md for the full design.
wiki: media-knowledge-projects
audience: >-
  Anyone curious about the buildings and the places — from a first-time
  reader or investor to an architect, engineer, or geospatial analyst.
  Plain language throughout; professional terms of art live inside
  articles, not in category names. This wiki carries the
  buildings-and-places half of the company's story.
version: 2026-07-15
companion: >-
  media-knowledge-corporate carries the company-and-money half: who the
  company is, what you invest in, how the money works, returns,
  governance, risks, and every company's reports. The two wikis together
  explain the whole company.

categories:
  - id: buildings
    name: "Development Classes"
    scope: >-
      What we build: the six development classes — Professional Centres,
      Suburban Office, Retail Select, Tech Industrial, and the planned
      Parking Structures and Vertical Warehouses — what each one is, who
      it is designed for, and its economics.
    audience: "Everyone — first visit; investors; AEC professionals"
    order: 1

  - id: building-design
    name: "Building Design"
    scope: >-
      The design system: buildings designed from the tenant out, fixed
      floor plates, the offset core, key plans and tiles, measurement
      standards, certifications, and BIM practice.
    audience: "Architects; AEC professionals"
    order: 2

  - id: site-selection
    name: "Site Selection"
    scope: >-
      The method behind "near Power Centres": the retail anchors,
      catchment and cluster analysis, scoring, and the tests a site must
      pass before land is bought.
    audience: "AEC professionals; development-market firms"
    order: 3

  - id: markets
    name: "Regional Markets"
    scope: >-
      Where we look: the covered Regional Market universe across North
      America and Europe, the co-location tier system behind it, country
      and tier indices, and a profile page for markets that have one.
    audience: "Development-market firms; investors"
    order: 4

  - id: rollout
    name: "Planned Development Program"
    scope: >-
      Where building is planned next: the intended programme across nine
      jurisdictions — Canada, the United States, Spain, Mexico, Poland,
      the United Kingdom, Italy, the Nordics, and New Europe — its
      planned development regions, and the registers that track
      candidate sites through the pipeline — locations, counts, and
      timing are targets and may change.
    audience: "Investors; development-market firms"
    order: 5

  - id: industry
    name: "Supply and Capital Conditions"
    scope: >-
      Woodfine's own structural policies in the Regional Markets: the
      construction and take-out financing capital gap the Direct-Hold
      Solutions are designed to address, and the deliberate under-building
      discipline that preserves pricing power.
    audience: "Analyst, banker, investor"
    order: 6

  - id: urban
    name: "Demand and Demographics"
    scope: >-
      The city-scale forces behind demand: the demographic signals that
      qualify a Regional Market, and the parking standards every site
      must meet.
    audience: "Development-market firms; AEC professionals"
    order: 7

  - id: gis
    name: "Maps and Data"
    scope: >-
      The maps and data behind the analysis: where the spatial data
      comes from, what it covers, and the methods used to screen markets
      and evaluate sites.
    audience: "GIS analysts; AEC professionals"
    order: 9

  - id: reference
    name: "Glossary and Reference"
    scope: >-
      Terminology and standard definitions for buildings, markets, and
      geographic analysis, in plain words, plus a reader's map to how this
      wiki itself is organized.
    audience: "All readers"
    order: 10

